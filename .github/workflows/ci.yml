name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install maintenance dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Lint and formatting
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Functional tests
        run: python -m pytest
      - name: Notebook schema and local documentation links
        run: python -m scripts.check_repository
      - name: Audit historical dataset
        run: |
          python -m scripts.audit_dataset dataset --output reports/dataset-audit.json
          python -c "import json; r=json.load(open('reports/dataset-audit.json')); n=len(r['cross_split_duplicate_groups']); print(f'::warning::Historical dataset has {n} exact cross-split duplicate groups; these results are not an independent benchmark.') if n else None"
      - name: Exercise evaluation interface on synthetic predictions
        run: python -m scripts.evaluate examples/predictions.csv --model synthetic-example --split synthetic-example --output reports/example-metrics.json
